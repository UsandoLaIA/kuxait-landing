server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;
  gzip_min_length 1024;

  # nginx does not inherit add_header into a location that declares its own,
  # so the security headers are repeated in every block on purpose.

  # Long cache for static assets
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri =404;
  }

  # HTML always revalidates
  location ~* \.html$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
  }

  # Clean URLs: /terms -> /terms.html
  location / {
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri $uri.html $uri/ =404;
  }
}
