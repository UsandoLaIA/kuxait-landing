server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml application/xml;
  gzip_min_length 1024;

  # Long cache for static assets, short for HTML
  location ~* \.(css|js|svg|png|jpg|jpeg|webp|woff2)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
  }
  location ~* \.(html)$ {
    add_header Cache-Control "no-cache";
  }

  # Clean URLs: /terms -> /terms.html
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
  add_header Referrer-Policy strict-origin-when-cross-origin;
}
